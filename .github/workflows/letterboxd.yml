name: Sync Letterboxd

on:
  schedule:
    - cron: '37 12 * * *'   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/letterboxd.yml'
      - 'scripts/letterboxd_sync.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: letterboxd-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch diary feed
        run: python3 scripts/letterboxd_sync.py lordwoogie letterboxd.json

      - name: Commit if the diary changed
        id: commit
        run: |
          git add letterboxd.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Letterboxd diary"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with this workflow's token don't start other workflows,
      # so ask the Pages workflow to redeploy explicitly.
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
